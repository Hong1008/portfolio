    caseStudies:
      - title: "배치 재실행과 메시지 중복 전달을 분리한 메일 발송 구조"
        problem:
          text: "기존 네이버웍스 API는 서버의 일괄 발송에 적합하지 않았고, 배치 재실행과 SQS 메시지 재전달을 서로 다른 실패 조건으로 다뤄야 했습니다."
          refs:
            - "shopl#fact:mail-provider"
            - "shopl#fact:duplicate-defense"
        decision:
          text: "AWS SES로 전환하고 대상자를 선정하는 배치 서버와 전송을 담당하는 메일 서버를 SQS로 분리했습니다. 배치 단계에는 발송 기준일, 소비 단계에는 메일 트랜잭션 키를 포함한 DB UNIQUE 제약을 적용했습니다."
          refs:
            - "shopl#fact:mail-provider"
            - "shopl#fact:mail-boundary"
            - "shopl#fact:duplicate-defense"
        verification:
          text: "메일 발송 기능은 운영됐으며, 온보딩 상태와 발송 조건을 분리한 구조를 인보이스 메일에도 재사용했습니다."
          refs:
            - "shopl#fact:operation-status"
            - "shopl#fact:mail-reuse"
        limitation:
          text: "두 단계의 DB 제약은 중복 처리를 방어하는 범위이며, 메일이 항상 한 번만 전달된다는 보장은 아닙니다."
          refs:
            - "shopl#fact:duplicate-defense"
      - title: "보고서 생성 엔진 전환과 Kotlin DSL 공통화"
        problem:
          text: "POI 기반 점검 보고서 생성에서 지연이 발생했고 Workbook·Sheet·Row·Cell 처리 코드가 보고서마다 반복됐습니다."
          refs:
            - "shopl#fact:report-generation"
        decision:
          text: "생성 엔진을 FastExcel로 전환하고 반복 흐름을 Kotlin DSL 공통 빌더로 분리해 보고서 로직이 엑셀 라이브러리에 직접 의존하지 않도록 했습니다."
          refs:
            - "shopl#fact:report-generation"
        verification:
          text: "공통 빌더는 운영된 점검 보고서에서 사용됐고, 보고서별 구현은 같은 생성 구조를 재사용했습니다."
          refs:
            - "shopl#fact:report-generation"
            - "shopl#fact:operation-status"
        limitation:
          text: "운영 환경의 전후 측정 근거를 확인할 수 없어 생성 시간 개선 수치는 사용하지 않습니다."
          refs:
            - "shopl#fact:report-generation"
    additionalContributions:
      - text: "현장 이슈의 상태·변경 이력과 AWS S3 기반 다중 이미지 첨부·수정 API를 구현했습니다."
