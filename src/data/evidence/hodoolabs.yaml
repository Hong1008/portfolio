risks:
  - claim: "결제 유실 자동 복구"
    reason: "승인 후 DB 상태 저장이 실패한 경우에는 복구할 수 없다."
    safeWording: "결제 승인 후 재화 제공 미완료 주문을 재처리했다."

  - claim: "완전한 분산 동시성 제어"
    reason: "synchronized는 단일 JVM에만 적용되고 다중 WAS의 영수증 검증은 동시에 실행될 수 있다."
    safeWording: "애플리케이션 사전 검증과 DB UNIQUE 제약을 중복 방어선으로 사용했다."

  - claim: "ShedLock으로 결제 멱등성 보장"
    reason: "ShedLock은 복구 스케줄러의 중복 실행만 방지한다."
    safeWording: "여러 WAS에서 복구 배치가 동시에 실행되지 않도록 했다."

  - claim: "결제 시스템 전체 단독 설계"
    reason: "Stored Procedure와 DB 처리 구조는 DBA가 설계했다."
    safeWording: "애플리케이션 결제 흐름을 구현하고 DB 처리 구조를 담당한 DBA와 협업했다."
