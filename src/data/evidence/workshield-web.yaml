contentSlug: workshield-web
lastReviewedAt: "2026-08-10"

facts:
  - id: project-scope
    statement: "선행 프로젝트의 계약서 비교 MCP를 웹 사용자 흐름, FastAPI API, LLM 설명 계층과 AWS 배포 환경에 연결한 5인 팀 프로젝트다."
    sourceType: repository
    source: "https://github.com/SKNETWORKS-FAMILY-AICAMP/SKN30-4th-2Team"
    scope: "프로젝트 범위"
    public: true
    confidence: confirmed
    note: "MCP 검색·분류 엔진의 기존 성과를 Web Platform의 신규 성과로 중복 계산하지 않는다."

  - id: contribution
    statement: "Hong1008의 공개 PR에서 API 기반, Review 상태 전이, LLM 오케스트레이션, AWS CDK와 배포 자동화 기여를 확인할 수 있다."
    sourceType: repository
    source: "https://github.com/SKNETWORKS-FAMILY-AICAMP/SKN30-4th-2Team/pulls?q=is%3Apr+author%3AHong1008"
    scope: "개인 기여"
    public: true
    confidence: confirmed
    note: "PR에 upstream 병합이 포함될 수 있으므로 변경 파일 전체를 단독 구현으로 표현하지 않는다."

  - id: review-state
    statement: "Review Aggregate는 QUEUED, REVIEWING, COMPLETED, FAILED, CANCELLED, EXPIRED 상태와 단조 진행률 규칙을 관리한다."
    sourceType: code
    source: "https://github.com/SKNETWORKS-FAMILY-AICAMP/SKN30-4th-2Team/pull/23"
    scope: "비동기 검토 상태"
    public: true
    confidence: confirmed
    note: "중단된 작업은 중단 지점부터 재개하지 않고 재시도 가능한 실패로 정리한다."

  - id: concurrency-guards
    statement: "Idempotency-Key와 request fingerprint, 세션별 active review partial UNIQUE index, version 기반 낙관적 잠금을 서로 다른 중복·경쟁 방어로 사용한다."
    sourceType: code
    source: "docs/source_of_truth/projects/workshield-web.md §5"
    scope: "멱등성과 동시 상태 변경"
    public: true
    confidence: confirmed
    note: "분산 환경의 Exactly-once 실행을 보장하지 않는다."

  - id: anonymous-session
    statement: "익명 접근 토큰은 HttpOnly Cookie로 전달하고 DB에는 SHA-256 해시만 저장하며, storage key와 30분 만료 정책으로 임시 파일 수명주기를 관리한다."
    sourceType: code
    source: "docs/source_of_truth/projects/workshield-web.md §6"
    scope: "접근 제어와 임시 파일"
    public: true
    confidence: confirmed
    note: "업로드 문서의 개인정보 자동 마스킹은 제공하지 않는다."

  - id: mcp-transport
    statement: "로컬 stdio와 배포 환경 streamable HTTP에 따라 MCP 연결과 문서 전달 방식을 분리하고, capability handshake 실패를 API readiness에 반영한다."
    sourceType: code
    source: "docs/source_of_truth/projects/workshield-web.md §7"
    scope: "MCP 연결과 실패 경계"
    public: true
    confidence: confirmed
    note: "최종 streamable HTTP 전체 E2E와 장애 주입 완료 여부는 별도 확인 전 단정하지 않는다."

  - id: chat-answer-plan
    statement: "Chat은 LLM 호출 전에 질문 유형·대상 조항·근거를 AnswerPlan으로 확정하고 긴 결과를 분할해 SSE로 전달한다."
    sourceType: code
    source: "docs/source_of_truth/projects/workshield-web.md §8"
    scope: "Chat 라우팅과 스트리밍"
    public: true
    confidence: confirmed
    note: "현행 Chat 구조는 LangGraph가 아니라 애플리케이션 서비스 파이프라인이다."

  - id: source-binding
    statement: "Suggestions 모델은 닫힌 집합의 근거 종류만 선택하고, 실제 출처 ID는 백엔드가 현재 요청의 검증된 근거에 결합한다."
    sourceType: code
    source: "https://github.com/SKNETWORKS-FAMILY-AICAMP/SKN30-4th-2Team/pull/31"
    scope: "LLM 출력과 출처 무결성"
    public: true
    confidence: confirmed
    note: "source key 선택 자체의 정확성이나 환각 제거를 보장하지 않는다."

  - id: deployment-boundary
    statement: "AWS CDK와 GitHub Actions로 배포를 구성하고, GitHub OIDC 배포 역할과 고권한 인프라·비밀·RunPod 수명주기를 분리했다."
    sourceType: code
    source: "https://github.com/SKNETWORKS-FAMILY-AICAMP/SKN30-4th-2Team/pull/48"
    scope: "인프라와 배포 권한"
    public: true
    confidence: confirmed
    note: "단일 EC2 구조이며 고가용성·무중단 배포로 표현하지 않는다."

