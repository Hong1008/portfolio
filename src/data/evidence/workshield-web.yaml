risks:
  - claim: "법률 검토 자동화"
    reason: "표준계약서 대비 검토 후보와 참고 근거를 제공하며 법률 판단을 수행하지 않는다."
    safeWording: "계약서 비교 MCP를 검토 후보와 근거를 탐색하는 웹 서비스에 연결했다."

  - claim: "Exactly-once 검토 실행"
    reason: "SQLite와 프로세스 내부 실행 큐의 단일 실행 프로세스 구조이며 여러 방어선도 각자 제한된 범위만 책임진다."
    safeWording: "멱등 키·DB UNIQUE 제약·낙관적 잠금으로 중복 요청과 상태 경쟁을 구분해 처리했다."

  - claim: "환각 제거"
    reason: "결정론적 검사는 정해진 오류를 차단하지만 모델 출력 의미의 전체 정확성을 보장하지 않는다."
    safeWording: "모델의 출처 ID 생성을 제거하고 백엔드가 검증된 근거 ID를 결합했다."

  - claim: "16/16 법률 정확도"
    reason: "고정된 합성 검증 데이터에서 보정을 포함해 최종 검사를 통과한 개발 검증 결과다."
    safeWording: "동일한 합성 검증 데이터 8개를 2회 실행한 최종 검증에서 16/16 통과를 확인했다."

  - claim: "고가용성·무중단 배포"
    reason: "단일 EC2 구조이며 다중 instance와 자동 traffic failover를 지원하지 않는다."
    safeWording: "검증된 컨테이너와 Web 산출물을 재빌드 없이 다시 활성화하는 롤백을 구성했다."
