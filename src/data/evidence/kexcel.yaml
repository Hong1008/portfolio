risks:
  - claim: "Zero-allocation"
    reason: "벤치마크에서도 약 364B의 추가 할당이 남아 있다."
    safeWording: "DSL 실행당 추가 할당량을 약 200KB에서 364B로 줄였다."

  - claim: "Thread-safe"
    reason: "여러 스레드의 안전한 동시 쓰기를 지원하는 것이 아니라 오용을 감지해 실패시킨다."
    safeWording: "동일 시트 동시 쓰기를 감지해 Fail-Fast로 차단한다."

  - claim: "메모리 사용량이 데이터 크기와 무관하다"
    reason: "병합 메타데이터 등 데이터 규모에 따라 남는 메모리 비용이 있다."
    safeWording: "512MB heap 환경에서 최대 100만 행 생성 벤치마크를 완료했다."

  - claim: "성능 518% 개선"
    reason: "전체 파일 생성 성능이 아니라 특정 병합 벤치마크의 처리량 비교다."
    safeWording: "병합 처리량을 3.36에서 17.42 ops/s로 개선했다."

  - claim: "메모리 99.8% 절감"
    reason: "전체 메모리가 아니라 DSL의 추가 할당량 기준이다."
    safeWording: "DSL 실행당 추가 할당량을 약 200KB에서 364B로 축소했다."

  - claim: "POI 병합 문제를 안전하게 완전히 해결"
    reason: "addMergedRegionUnsafe는 중복 검증을 우회하며 병합 메타데이터가 메모리에 계속 유지되는 비용은 남는다."
    safeWording: "병합 중복 검증을 우회해 CPU 병목을 줄였으며, 잘못된 병합 방지와 메모리 비용은 별도 제약으로 남는다."

  - claim: "회사 업무에서 KExcel 전체 기능을 구현"
    reason: "KExcel은 실무 문제를 사후에 일반화한 개인 프로젝트다."
    safeWording: "실무에서 경험한 문제를 바탕으로 개인 프로젝트에서 엔진 추상화와 벤치마크를 추가 구현했다."
