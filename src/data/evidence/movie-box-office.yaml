contentSlug: movie-box-office
lastReviewedAt: "2026-07-21"

facts:
  - id: project-context
    statement: "영화 흥행 예측 및 배급 시뮬레이터는 2026년 5월 SK Networks Family AI 캠프에서 진행한 5인 팀 프로젝트다."
    sourceType: user-confirmed
    source: "docs/SOURCE_OF_TRUTH.md §9.1"
    scope: "프로젝트 기간·형태·팀 규모"
    public: true
    confidence: confirmed
    note: null
  - id: contribution
    statement: "PM으로서 2-Stage 구조 제안·설계, 데이터 수집, 모델 비교·선정과 Streamlit 데모를 담당했다."
    sourceType: user-confirmed
    source: "docs/SOURCE_OF_TRUTH.md §9.1–9.2"
    scope: "개인 기여"
    public: true
    confidence: confirmed
    note: "팀 전체의 데이터·모델 작업을 개인 단독 성과로 표현하지 않는다."
  - id: dependency-problem
    statement: "스크린 수는 흥행에 영향을 주는 동시에 영화의 기대 잠재력에 따라 결정될 수 있어, 단일 모델에서는 배급 변수의 효과와 콘텐츠 잠재력이 혼재할 수 있다."
    sourceType: user-confirmed
    source: "docs/SOURCE_OF_TRUTH.md §9.1"
    scope: "문제 정의와 모델링 가설"
    public: true
    confidence: confirmed
    note: "상호 의존성을 고려한 구조이지 내생성 해결 또는 인과 효과 검증이 아니다."
  - id: dataset
    statement: "KOBIS와 네이버 데이터랩 데이터를 수집해 2010년부터 2025년까지 영화 2,489편, 28개 컬럼의 데이터를 MySQL에 적재하고 개봉일 기준으로 시간 분할했다."
    sourceType: user-confirmed
    source: "docs/SOURCE_OF_TRUTH.md §9.2"
    scope: "데이터 수집·적재·분할"
    public: true
    confidence: confirmed
    note: null
  - id: two-stage-model
    statement: "Stage 1은 배급 변수를 제외한 콘텐츠 잠재력을 예측하고, Stage 2는 pred_potential과 개봉 1일차 스크린 수·상영 횟수 등 배급 변수를 입력으로 사용했다."
    sourceType: user-confirmed
    source: "docs/SOURCE_OF_TRUTH.md §9.3"
    scope: "2-Stage 모델 구조"
    public: true
    confidence: confirmed
    note: "Stage 2는 배급 변수의 인과 효과를 추정하는 모델이 아니다."
  - id: monotonic-constraint
    statement: "Stage 2 XGBoost에 스크린 수 증가 시 예상 관객 수가 감소하는 비현실적인 방향을 막기 위한 단조 증가 제약을 적용했다."
    sourceType: user-confirmed
    source: "docs/SOURCE_OF_TRUTH.md §9.3"
    scope: "모델 제약"
    public: true
    confidence: confirmed
    note: "제약은 예측 방향을 제한하며 실제 배급 효과를 보장하지 않는다."

