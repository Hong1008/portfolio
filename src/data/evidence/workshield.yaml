contribution:
  mine:
    - "PM"
    - "시스템 구조 설계"
    - "MCP 서버 구현"
    - "RRF 점수 계약 오류 수정"
    - "실제 실행 trace 기반 평가 구조 개선"
  team:
    - "계약·표준조항 데이터 준비"
    - "모델과 평가 실험"
    - "데모 작업"
  external:
    - "Chroma와 BM25는 검색 구성 요소다."
    - "RunPod worker는 임베딩과 rerank 모델 실행을 담당한다."

publication:
  allowed:
    - "공개 저장소 코드와 README"
    - "MCP 서버의 책임 경계"
    - "검색 파이프라인과 상태 의미"
    - "골든 데이터 구성과 평가 결과"
    - "합성 계약서 실행 예시"
  anonymize: []
  prohibited:
    - "실제 계약서와 개인정보"
    - "법률 자문 또는 법률적 정확도로 오해할 표현"

risks:
  - claim: "계약서 법률 검토 자동화"
    reason: "시스템은 표준 대비 검토 후보와 근거를 제공하며 법률 판단을 수행하지 않는다."
    safeWording: "표준계약서 대비 검토 후보와 근거를 제공한다."

  - claim: "F1 0.754의 법률 정확도"
    reason: "지표는 정해진 골든 데이터에서 1차 조항 대응 상태를 분류한 기준선이다."
    safeWording: "v5 골든 데이터의 1차 조항 대응 상태 분류 F1은 0.754다."

  - claim: "RunPod로 비용과 속도를 개선"
    reason: "비용과 처리 속도는 측정하지 않았다."
    safeWording: "모델 의존성과 GPU 실행 환경을 MCP 애플리케이션에서 분리했다."

  - claim: "C1 실험 채택"
    reason: "F1과 FN은 개선됐지만 FP가 1건에서 2건으로 늘었다."
    safeWording: "C1은 SW held-out F1이 0.706에서 0.800으로 변했지만 FP 증가를 함께 확인해 보류했다."

  - claim: "합성 계약서 결과가 전체 품질을 증명"
    reason: "하나의 prod 구성 실행 예시이며 모델·인덱스·코퍼스에 따라 달라질 수 있다."
    safeWording: "2026년 7월 13일 prod 구성의 합성 계약서 실행 예시다."
