contentSlug: workshield
lastReviewedAt: "2026-07-20"

facts:
  - id: project-scope
    statement: "WorkShield는 IT·SW 계약서를 표준계약서와 조항 단위로 비교해 검토 후보와 근거를 제공하는 팀 프로젝트다."
    sourceType: user-confirmed
    source: "docs/SOURCE_OF_TRUTH.md §8.1–8.2"
    scope: "프로젝트 목표와 비목표"
    public: true
    confidence: confirmed
    note: "법률 자문, 위법·합법 판단 또는 계약 안전성 보장으로 표현하지 않는다."

  - id: role
    statement: "5인 팀에서 PM, 시스템 설계와 MCP 구현을 담당했다."
    sourceType: user-confirmed
    source: "docs/SOURCE_OF_TRUTH.md §8.1"
    scope: "개인 기여"
    public: true
    confidence: confirmed
    note: "팀 전체 작업을 개인 단독 성과로 표현하지 않는다."

  - id: deterministic-boundary
    statement: "문서 처리·검색·재정렬·상태 분류를 수행하는 결정론적 MCP 서버와 선택적 LLM 클라이언트를 분리했다."
    sourceType: user-confirmed
    source: "docs/SOURCE_OF_TRUTH.md §8.3"
    scope: "시스템 책임 경계"
    public: true
    confidence: confirmed
    note: null

  - id: rrf-contract
    statement: "약 0.0328 범위의 RRF 점수와 0.5 분류 임계값이 직접 비교되던 계약 오류를 실제 실행에서 확인하고 수정했다."
    sourceType: user-confirmed
    source: "docs/SOURCE_OF_TRUTH.md §8.6"
    scope: "오류 진단과 수정"
    public: true
    confidence: confirmed
    note: "테스트 대역은 실제 점수 범위를 재현하지 못했다."

  - id: trace-evaluation
    statement: "평가 시 검색을 재실행하지 않고 실제 판정에 사용한 후보와 점수를 trace로 보존했다."
    sourceType: user-confirmed
    source: "docs/SOURCE_OF_TRUTH.md §8.7"
    scope: "평가 구조"
    public: true
    confidence: confirmed
    note: null

  - id: repository
    statement: "프로젝트 저장소는 공개돼 있다."
    sourceType: repository
    source: "https://github.com/SKNETWORKS-FAMILY-AICAMP/SKN30-3rd-2Team"
    scope: "공개 근거"
    public: true
    confidence: confirmed
    note: null

