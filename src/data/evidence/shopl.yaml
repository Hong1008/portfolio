    safeWording: "배치 재실행과 메시지 중복 전달을 각각 DB UNIQUE 제약으로 방어했다."

  - claim: "메일 발송 자동 복구"
    reason: "재처리와 실패 복구의 전체 범위가 확인되지 않았다."
    safeWording: "배치 재실행과 중복 메시지를 고려한 발송 구조를 구현했다."

  - claim: "보고서 생성 시간을 30초에서 3초로 개선"
    reason: "회사 운영 환경의 원본 측정 근거가 확인되지 않았다."
    safeWording: "POI 기반 생성 방식을 FastExcel로 전환하고 생성 흐름을 공통화했다."

  - claim: "KExcel을 회사에 도입"
